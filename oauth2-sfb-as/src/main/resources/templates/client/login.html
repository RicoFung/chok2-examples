<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Client 登录页面</title>
    <link type="text/css" rel="stylesheet" th:href="@{/jquery-easyui/themes/material-blue/easyui.css}" />
    <link type="text/css" rel="stylesheet" th:href="@{/jquery-easyui/themes/mobile.css}" />
    <link type="text/css" rel="stylesheet" th:href="@{/jquery-easyui/themes/icon.css}" />
    <link type="text/css" rel="stylesheet" th:href="@{/jquery-easyui/demo/demo.css}" />
    <script type="text/javascript" th:src="@{/jquery-easyui/jquery.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery-easyui/jquery.easyui.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery-easyui/jquery.easyui.mobile.js}"></script>
</head>
<body>
<div style="position: absolute; left: 50%; transform: translateX(-50%); max-width: 500px; width: 100%; padding: 10px;">
    <div class="easyui-panel" style="margin: 0; padding: 10px; box-sizing: border-box; width: 100%;">
	    <header id="title">
	        <div class="m-toolbar">
	            <span class="m-title">Login to Client System</span>
	        </div>
	    </header>
		<form id="ff" action="/client/loginProcess" method="post">
	        <div style="margin:20px auto;">
	            <input class="easyui-textbox" name="captcha" style="width:100%" data-options="label:'Captcha',required:true,prompt:'Captcha',iconCls:'icon-man'">
	        </div>
	        <div style="margin:20px auto;">
	            <input class="easyui-textbox" name="username" style="width:100%" data-options="label:'Username',required:true,prompt:'Username',iconCls:'icon-man'">
	        </div>
	        <div style="margin:20px auto;">
	            <input class="easyui-passwordbox" name="password" style="width:100%" data-options="label:'Password',required:true,prompt:'Password',validType:'password'">
	        </div>
		    <div style="text-align:center;padding:5px 0">
		        <a href="javascript:void(0)" class="easyui-linkbutton" onclick="submitForm()" style="width:80px">Submit</a>
		        <a href="javascript:void(0)" class="easyui-linkbutton" onclick="resetForm()" style="width:80px">Reset</a>
		        <a href="javascript:void(0)" class="easyui-linkbutton" onclick="backForm()" style="width:80px">Back</a>
		    </div>
	    </form>
	</div>
	<input type="hidden" id="error" th:value="${error}"/> <!-- 将错误消息存储在隐藏域中 -->
	<input type="hidden" id="errorMessage" th:value="${errorMessage}"/> <!-- 将错误消息存储在隐藏域中 -->
</div>
<script type="text/javascript" th:src="@{/client/login.js}"></script>
</body>
</html>
